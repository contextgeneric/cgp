# Publish the workspace as one version.
#
# Every crate inherits `[workspace.package].version`. `version_group` makes
# release-plz assign that single next version to every crate it releases, then
# rewrite the path-dependency versions in the root `Cargo.toml` to match.
# The facade owns the root changelog, the `v<version>` tag, and the GitHub release.
# The other crates are published in dependency order under that same version.

[workspace]
release_always = false
repo_url = "https://github.com/Just-Replicant/cgp-fork"
# A release PR is opened only when a commit since the last release matches.
# `test`, `refactor`, `docs`, and `chore` commits stay on main until a
# `feat`, `fix`, `perf`, or breaking commit lands with them.
release_commits = '^(feat|fix|perf)(\([^)]*\))?!?:|^\w+(\([^)]*\))?!:'
git_release_enable = false
git_tag_enable = false
changelog_update = false
publish_timeout = "30m"

[changelog]
header = """
# Changelog

"""
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "added" },
  { message = "^fix", group = "fixed" },
  { message = "^perf", group = "changed" },
  { message = "^refactor", group = "changed" },
  { message = "^doc", group = "documentation" },
  { message = "^test", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^style", skip = true },
  { message = "^.*", group = "other" },
]

[[package]]
name = "cgp-fork"
version_group = "cgp-fork"
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = [
  "cgp-fork-base",
  "cgp-fork-base-extra",
  "cgp-fork-core",
  "cgp-fork-extra",
  "cgp-fork-base-types",
  "cgp-fork-component",
  "cgp-fork-type",
  "cgp-fork-field",
  "cgp-fork-error",
  "cgp-fork-field-extra",
  "cgp-fork-error-extra",
  "cgp-fork-handler",
  "cgp-fork-log",
  "cgp-fork-monad",
  "cgp-fork-dispatch",
  "cgp-fork-run",
  "cgp-fork-runtime",
  "cgp-fork-async-macro",
  "cgp-fork-macro",
  "cgp-fork-macro-core",
  "cgp-fork-macro-lib",
  "cgp-fork-macro-test-util",
  "cgp-fork-macro-test-util-lib",
  "cgp-fork-extra-macro",
  "cgp-fork-extra-macro-lib",
  "cgp-fork-extra-macro-core",
  "cgp-fork-error-anyhow",
  "cgp-fork-error-eyre",
  "cgp-fork-error-std",
  "cgp-fork-tests",
  "cgp-fork-macro-tests",
]
git_release_enable = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"

