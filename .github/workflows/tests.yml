name: Tests

on:
  pull_request: {}
  push:
    branches: [main]

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

# Cancel in-progress runs when a new commit is pushed to the same PR, branch, or tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# To minimize supply-chain exposure this workflow uses only GitHub's own
# first-party actions; every toolchain and tool is installed from rustup, the
# tool's official distribution, or the checked-in sources.
#
# Every job runs one of the repository's checks, and this file is where that
# list lives, so a contributor can reproduce any job from here.
jobs:
  fmt:
    name: Rustfmt (nightly-2026-11-05)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # `.rustfmt.toml` sets `group_imports` and `imports_granularity`, which are
      # unstable options, so rustfmt needs a nightly. The channel is pinned so a
      # reformat cannot land without a commit.
      - name: Install the pinned nightly for rustfmt
        run: rustup toolchain install nightly-2026-11-05 --profile minimal --component rustfmt
      - run: cargo +nightly-2026-11-05 fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Clippy (all features)
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --no-default-features --all-targets -- -D warnings

  test:
    name: Test (nextest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # The official nextest distribution, at a pinned version: a prebuilt binary,
      # so the job needs no compiler for it. The host intermittently answers 504,
      # so a failed download builds the same pinned version from crates.io instead
      # of failing the job.
      - name: Install cargo-nextest from the official distribution
        run: |
          set -o pipefail
          if ! curl -LsSf --retry 3 --retry-delay 2 --retry-all-errors \
            https://get.nexte.st/0.9.151/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"; then
            echo "the official distribution did not answer; building 0.9.151 from crates.io" >&2
            cargo install --locked cargo-nextest --version 0.9.151
          fi
      # The suite covers `cgp-tests` for behavior and expansion snapshots and
      # `cgp-macro-tests` for the macro internals. Post-codegen compile failures
      # are UI fixtures in `cargo-cgp`, not tests here.
      - name: Run tests
        run: cargo nextest run --all-features --no-fail-fast --workspace

  doc:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Build the docs with warnings denied
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace --all-features

  msrv:
    name: Minimum Rust (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the declared minimum toolchain
        run: rustup toolchain install 1.89 --profile minimal
      - name: Check the workspace on the declared minimum
        run: cargo +1.89 check --workspace --all-features

  no_std:
    name: No std
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain and the bare-metal target
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-none
      - name: Check without std
        run: cargo check -p cgp-no-std-tests --target x86_64-unknown-none
      - name: Check with alloc
        run: cargo check -p cgp-no-std-tests --target x86_64-unknown-none --features alloc
