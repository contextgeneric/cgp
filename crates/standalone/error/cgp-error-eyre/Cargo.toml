[package]
name         = "cgp-error-eyre"
version      = "0.8.0-alpha"
readme       = "./README.md"
edition      = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
rust-version = { workspace = true }
homepage     = { workspace = true }
keywords     = { workspace = true }
categories   = [ "rust-patterns" ]
description  = "CGP error providers that make eyre::Report a context's abstract error type."

[dependencies]
cgp         = { version = "0.8.0-alpha", path = "../../../main/cgp-core", package = "cgp-core" }
# `auto-install` installs eyre's default report handler on first use. Without it, building any
# `eyre::Report` panics unless the application has called `eyre::set_hook` first.
#
# `track-caller` records where a report was built. `CanRaiseError::raise_error` is
# `#[track_caller]`, and so is every impl of it, which is what lets that location be the caller's
# line rather than a line in this crate.
eyre        = { version = "0.6.14", default-features = false, features = [ "auto-install", "track-caller" ] }
