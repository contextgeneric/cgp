[package]
name         = "cgp"
version      = "0.8.0-alpha"
readme       = "./README.md"
edition      = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
rust-version = { workspace = true }
homepage     = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = { workspace = true }

[features]
default = []
# Turn on the providers that need an allocator. A `no_std` build without one leaves
# this off, and `default-features = false` needs neither `std` nor `alloc`.
alloc = [ "cgp-extra/alloc" ]

[dependencies]
cgp-core       = { workspace = true }
cgp-extra      = { workspace = true }
