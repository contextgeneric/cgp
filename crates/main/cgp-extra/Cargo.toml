[package]
name         = "cgp-extra"
version      = "0.8.0-alpha"
edition      = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
rust-version = { workspace = true }
homepage     = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "CGP's extra layer through cgp::extra: handlers, monads, dispatch, runtime, runners, the optional-field layer, and the generic error providers."

[features]
default = []
# The `alloc` feature turns on the providers that need an allocator, such as
# `DebugError` and `DisplayError`. A `no_std` build without an allocator leaves it
# off, and `default-features = false` needs neither `std` nor `alloc`.
alloc = [ "cgp-error-extra/alloc" ]
full = [ "alloc" ]

[dependencies]
cgp-core        = { workspace = true }
cgp-macro-extra = { workspace = true }
cgp-error-extra = { workspace = true }
cgp-field-extra = { workspace = true }
cgp-run         = { workspace = true }
cgp-runtime     = { workspace = true }
cgp-handler     = { workspace = true }
cgp-monad       = { workspace = true }
cgp-dispatch    = { workspace = true }

[package.metadata.docs.rs]
all-features = true
