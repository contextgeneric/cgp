[package]
name         = "cgp-fork-macro-test-util"
version      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
rust-version = { workspace = true }
homepage     = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "CGP snapshot macros that pin the code the procedural macros generate."

[lib]
proc-macro = true

[dependencies]
cgp-fork-macro-lib                   = { workspace = true }
cgp-fork-macro-core                  = { workspace = true }
cgp-fork-macro-test-util-lib         = { workspace = true }

syn             = { version = "2.0.95", features = [ "full", "extra-traits", "visit", "visit-mut" ] }
quote           = { version = "1.0.38" }
proc-macro2     = { version = "1.0.92" }
