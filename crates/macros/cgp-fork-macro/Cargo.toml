[package]
name         = "cgp-fork-macro"
version      = { workspace = true }
edition      = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
rust-version = { workspace = true }
homepage     = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "CGP procedural macros for defining and wiring components."

[lib]
proc-macro = true

[features]
snapshot = ["dep:prettyplease"]

[dependencies]
syn         = { version = "2.0.95", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote       = { version = "1.0.38" }
proc-macro2 = { version = "1.0.92" }
itertools   = { version = "0.14.0" }
prettyplease = { version = "0.2.37", optional = true }

[dev-dependencies]
insta = { version = "1.48.0" }
prettyplease = { version = "0.2.37" }
