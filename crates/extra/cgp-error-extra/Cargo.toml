[package]
name         = "cgp-error-extra"
version      = "0.8.0-alpha"
edition      = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
rust-version = { workspace = true }
homepage     = { workspace = true }
keywords     = { workspace = true }
categories   = { workspace = true }
description  = "CGP's generic error providers, which raise, return, discard, and format an error."

[features]
default = []
# The `DebugError` and `DisplayError` providers need an allocator, so they are
# behind this feature. A `no_std` build without one leaves it off.
alloc = []

[dependencies]
cgp         = { version = "0.8.0-alpha", path = "../../main/cgp-core", package = "cgp-core" }

[package.metadata.docs.rs]
all-features = true
